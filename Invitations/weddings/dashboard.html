<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Invitations | Axilwood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        .font-elegant { font-family: 'Cormorant Garamond', serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen relative overflow-x-hidden selection:bg-amber-500/30">

    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] bg-amber-600/10 blur-[120px] rounded-full pointer-events-none z-0"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-blue-600/10 blur-[120px] rounded-full pointer-events-none z-0"></div>

    <main class="container mx-auto px-6 py-12 max-w-6xl min-h-screen relative z-10">
        
        <div id="auth-warning" class="hidden text-center py-20 bg-white/5 backdrop-blur-lg border border-white/10 rounded-2xl shadow-2xl mt-10">
            <h2 class="text-3xl font-bold text-white">Access Denied</h2>
            <p class="mt-4 text-gray-400">Please sign in to view your dashboard.</p>
            <a href="/Invitations" class="mt-8 inline-block bg-gradient-to-r from-amber-500 to-yellow-600 text-white font-bold py-3 px-8 rounded-xl transition-transform active:scale-95">Go to Login</a>
        </div>

        <div id="dashboard-content" class="hidden">
            
            <div class="mb-12 flex flex-col md:flex-row md:justify-between md:items-end gap-6 border-b border-white/10 pb-6">
                <div>
                    <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-2 tracking-tight">My Invitations</h1>
                    <p class="text-gray-400 font-light text-lg" id="user-email">Loading your data...</p>
                </div>
                <div class="flex gap-4">
                    <button id="logout-btn" class="bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 px-5 py-2.5 rounded-xl backdrop-blur-md transition-all active:scale-95 text-sm font-semibold">Sign Out</button>
                    <a href="/Invitations/weddings/index.html" class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-white px-5 py-2.5 rounded-xl shadow-lg transition-transform active:scale-95 text-sm font-bold flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Create New
                    </a>
                </div>
            </div>

            <div id="loading-state" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="h-64 bg-white/5 border border-white/10 rounded-3xl animate-pulse"></div>
                <div class="h-64 bg-white/5 border border-white/10 rounded-3xl animate-pulse"></div>
            </div>

            <div id="invites-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
                </div>

            <div id="empty-state" class="hidden text-center py-20 bg-white/5 border border-white/10 rounded-3xl mt-8">
                <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-10 h-10 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 19v-8.93a2 2 0 01.89-1.664l7-4.666a2 2 0 012.22 0l7 4.666A2 2 0 0121 10.07V19M3 19a2 2 0 002 2h14a2 2 0 002-2M3 19l6.75-4.5M21 19l-6.75-4.5M3 10l6.75 4.5M21 10l-6.75 4.5m0 0l-1.14.76a2 2 0 01-2.22 0l-1.14-.76"></path></svg>
                </div>
                <h3 class="text-2xl font-bold text-white mb-2">No Invitations Yet</h3>
                <p class="text-gray-400 mb-6">Create your first beautiful, interactive wedding invitation.</p>
                <a href="/Invitations/weddings/index.html" class="inline-block bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-8 rounded-xl transition-all">Create Invitation</a>
            </div>

        </div>
    </main>

    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full shadow-2xl font-bold text-sm opacity-0 transition-opacity duration-300 z-50 pointer-events-none">
        Link copied to clipboard!
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // Your specific Supabase Keys
        const supabaseUrl = 'https://wqlwurobvkzjixkoivxf.supabase.co';
        const supabaseKey = 'sb_publishable_I4rCqO3kdJLN-U8fgLoskA_AchQwKVr';
        const supabase = createClient(supabaseUrl, supabaseKey);

        document.addEventListener("DOMContentLoaded", async function() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                document.getElementById('auth-warning').classList.remove('hidden');
                return;
            }

            document.getElementById('dashboard-content').classList.remove('hidden');
            document.getElementById('user-email').innerText = `Logged in as: ${session.user.email}`;

            // Fetch the user's invitations
            const { data: invites, error } = await supabase
                .from('wedding_invites')
                .select('*')
                .eq('user_id', session.user.id)
                .order('created_at', { ascending: false });

            document.getElementById('loading-state').classList.add('hidden');

            if (error) {
                console.error("Error fetching invites:", error);
                alert("Failed to load invitations.");
                return;
            }

            if (!invites || invites.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            const grid = document.getElementById('invites-grid');
            grid.classList.remove('hidden');

            // Build the UI Cards
            invites.forEach(invite => {
                // Calculate Total RSVPs safely
                let totalGuests = 0;
                if (invite.rsvps && Array.isArray(invite.rsvps)) {
                    totalGuests = invite.rsvps.reduce((sum, rsvp) => sum + (parseInt(rsvp.guests) || 0), 0);
                }

                const mainDate = new Date(invite.main_wedding_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                const fullUrl = `${window.location.origin}/Invitations/weddings/${invite.slug}`;
                const themeName = invite.design_prefs?.theme?.replace('_', ' ') || 'Minimalist';

                const card = document.createElement('div');
                card.className = "bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl p-6 relative flex flex-col justify-between shadow-[0_4px_20px_rgba(0,0,0,0.3)] hover:bg-white/10 transition-all duration-300 group";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-amber-500/20 text-amber-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-amber-500/30">${themeName}</span>
                        </div>
                        
                        <h2 class="text-3xl font-elegant font-bold text-white mb-1 leading-tight">${invite.groom_first_name} & ${invite.bride_first_name}</h2>
                        <p class="text-gray-400 text-sm mb-6 flex items-center">
                            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            ${mainDate}
                        </p>

                        <div class="bg-black/30 rounded-xl p-4 mb-6 border border-white/5 flex items-center justify-between">
                            <div>
                                <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-1">Live RSVP Count</p>
                                <p class="text-2xl font-bold text-green-400">${totalGuests} <span class="text-sm font-medium text-gray-400">Guests Confirmed</span></p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <a href="${fullUrl}" target="_blank" class="bg-white/10 hover:bg-white/20 text-white text-center py-2.5 rounded-lg text-sm font-semibold border border-white/10 transition-colors flex items-center justify-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            View Live
                        </a>
                        <button onclick="window.copyToClipboard('${fullUrl}')" class="bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-lg text-sm font-semibold transition-colors flex items-center justify-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Copy Link
                        </button>
                        <a href="/Invitations/weddings/edit.html?slug=${invite.slug}" class="bg-white/5 hover:bg-white/10 text-gray-300 text-center py-2.5 rounded-lg text-sm font-medium border border-white/5 transition-colors">
                            Edit Details
                        </a>
                        <button onclick="window.deleteInvite('${invite.id}')" class="bg-red-900/30 hover:bg-red-900/60 text-red-400 py-2.5 rounded-lg text-sm font-medium border border-red-900/50 transition-colors">
                            Delete
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        });

        // Global functions for the inline onClick handlers
        window.copyToClipboard = (url) => {
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 3000);
            });
        };

        window.deleteInvite = async (id) => {
            if(confirm("Are you sure you want to permanently delete this invitation? This cannot be undone.")) {
                const { error } = await supabase.from('wedding_invites').delete().eq('id', id);
                if (error) {
                    alert("Error deleting: " + error.message);
                } else {
                    location.reload(); // Refresh to update list
                }
            }
        };

        // Logout Logic
        document.getElementById('logout-btn')?.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = '/Invitations';
        });
    </script>
</body>
</html>
