<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation | Axilwood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* The new, bolder, elegant typography */
        .font-elegant { font-family: 'Cormorant Garamond', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }
        .bg-pattern { background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 20px 20px; }

        #dynamic-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -10; 
            background-color: #1a1a1a; 
        }
        
        #dynamic-background img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center;
            opacity: 0; 
            transition: opacity 1.5s ease-in-out;
            transform: scale(1.08); 
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-stagger {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }
        .delay-5 { animation-delay: 1.0s; }

        /* ==========================================
           TUNED DYNAMIC THEMES & LIQUID GLASS
           ========================================== */
        .glass-base {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.5s ease;
        }

        /* 1. Elegant Minimalist (Apple Liquid Glass) */
        .theme-minimalist {
            background: rgba(255, 255, 255, 0.15); /* Very sheer to show image */
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            color: #1f2937;
        }
        /* Completely removed the thin 'Inter' font. Now uses bold Cormorant! */
        .theme-minimalist h1 { color: #111827; text-shadow: 0px 4px 15px rgba(255,255,255,0.6); }
        .theme-minimalist .accent { color: #374151; font-weight: 600; }
        .theme-minimalist .border-divider { border-color: rgba(255, 255, 255, 0.4); }

        /* 2. Traditional Kerala (Warm Gold & Cream) */
        .theme-traditional_kerala {
            background: rgba(255, 253, 248, 0.55); /* Reduced from 0.85 for transparency */
            border: 2px solid rgba(212, 175, 55, 0.8); 
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
            color: #3e3129; 
        }
        .theme-traditional_kerala h1 { color: #8a6300; text-shadow: 0px 2px 10px rgba(255,255,255,0.8); }
        .theme-traditional_kerala .accent { color: #9c7816; font-weight: 700; }
        .theme-traditional_kerala .border-divider { border-color: rgba(212, 175, 55, 0.4); }

        /* 3. Royal Rajasthani (Dark Mode Glass) */
        .theme-royal_rajput {
            background: rgba(20, 5, 5, 0.55); /* Reduced from 0.80 for transparency */
            border: 1px solid rgba(255, 215, 0, 0.6);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            color: #fdf6e3;
        }
        .theme-royal_rajput h1 { color: #ffd700; text-shadow: 0px 4px 15px rgba(0,0,0,0.9); }
        .theme-royal_rajput .accent { color: #ffbc42; font-weight: 600; }
        .theme-royal_rajput .border-divider { border-color: rgba(255, 215, 0, 0.3); }

        /* 4. Pastel Floral (Soft Modern) */
        .theme-pastel_floral {
            background: rgba(255, 245, 247, 0.50); /* Reduced from 0.75 for transparency */
            border: 1px solid rgba(255, 182, 193, 0.5);
            border-radius: 40px !important; 
            box-shadow: 0 8px 32px rgba(219, 112, 147, 0.2);
            color: #3f3f3f;
        }
        .theme-pastel_floral h1 { font-style: italic; color: #a84869; text-shadow: 0px 2px 10px rgba(255,255,255,0.7); }
        .theme-pastel_floral .accent { color: #b84c71; font-weight: 600; }
        .theme-pastel_floral .border-divider { border-color: rgba(219, 112, 147, 0.3); }

    </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-4 md:p-8 relative">

    <div id="dynamic-background">
        <img id="bg-img" src="" alt="Background pattern">
    </div>

    <div id="loading" class="text-xl text-gray-800 font-sans animate-pulse bg-white/80 backdrop-blur-md px-8 py-4 rounded-full shadow-lg border border-gray-200 z-50">
        Loading your invitation...
    </div>

    <div id="invite-card" class="hidden max-w-2xl w-full glass-base p-8 md:p-16 rounded-3xl text-center relative overflow-hidden">
        
        <div id="host-line" class="tracking-widest uppercase text-xs md:text-sm font-bold font-sans mb-6 accent animate-stagger delay-1 leading-relaxed">
            You are invited to the wedding of
        </div>
        
        <h1 id="couple-names" class="text-5xl md:text-7xl font-elegant font-bold mb-8 mt-2 animate-stagger delay-2 leading-tight"></h1>
        
        <p id="welcome-msg" class="italic font-elegant font-medium text-xl md:text-2xl mb-10 px-4 leading-relaxed animate-stagger delay-3"></p>
        
        <div class="border-t border-b border-divider py-8 my-8 animate-stagger delay-4">
            <h3 class="text-xl md:text-2xl font-bold font-sans mb-4 uppercase tracking-wider accent">Main Ceremony</h3>
            <p id="main-date" class="font-sans text-lg font-medium"></p>
            <p id="main-venue" class="font-sans font-bold text-xl md:text-2xl mt-2"></p>
            
            <a href="#" id="map-btn" target="_blank" class="hidden mt-6 mx-auto inline-flex items-center justify-center gap-3 bg-white hover:bg-gray-50 text-gray-800 font-sans font-bold py-3 px-8 rounded-full shadow-md transition-transform hover:scale-105 border border-gray-200">
                <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.7 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
                Get Directions
            </a>
        </div>

        <div id="reception-block" class="hidden py-4 my-4 border-b border-divider pb-8 animate-stagger delay-5">
            <h3 class="text-xl md:text-2xl font-bold font-sans mb-4 uppercase tracking-wider accent">Reception</h3>
            <p id="rec-date" class="font-sans text-lg font-medium"></p>
            <p id="rec-venue" class="font-sans font-bold text-xl md:text-2xl mt-2"></p>
        </div>

        <div id="gifting-block" class="hidden py-4 mb-4 animate-stagger delay-5">
            <p id="gifting-text" class="italic font-elegant font-medium text-lg md:text-xl opacity-90"></p>
        </div>

        <div id="rsvp-block" class="mt-8 pt-4 animate-stagger delay-5">
            <h3 class="text-xl md:text-2xl font-bold font-sans mb-6 uppercase tracking-wider accent">Will you be joining us?</h3>
            
            <div id="rsvp-buttons" class="flex flex-col sm:flex-row justify-center gap-4">
                <button id="btn-accept" class="bg-green-600 hover:bg-green-700 text-white font-sans font-bold py-3 px-8 rounded-full shadow-lg transition-transform hover:scale-105">
                    Yes, I will join
                </button>
                <button id="btn-decline" class="bg-gray-500 hover:bg-gray-600 text-white font-sans font-bold py-3 px-8 rounded-full shadow-lg transition-transform hover:scale-105">
                    Unfortunately, I can't join
                </button>
            </div>

            <div id="guest-slider-section" class="hidden mt-6 bg-black/5 p-6 rounded-2xl border border-divider">
                <label class="block font-sans font-bold text-lg md:text-xl mb-4 text-center">Total number of people attending (including yourself):</label>
                <div class="flex items-center justify-center gap-6 mb-6">
                    <span class="text-2xl font-bold opacity-80">1</span>
                    <input type="range" id="guest-count" min="1" max="5" value="1" class="w-full max-w-[200px] h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-green-600">
                    <span id="guest-display" class="text-2xl font-bold opacity-80">1</span>
                </div>
                <button id="btn-confirm-rsvp" class="bg-amber-600 hover:bg-amber-700 text-white font-sans font-bold py-3 px-8 rounded-full shadow-md transition-transform hover:scale-105 w-full sm:w-auto">
                    Confirm Attendance
                </button>
            </div>

            <div id="rsvp-thank-you" class="hidden mt-6 text-2xl font-elegant italic font-bold accent">
            </div>
        </div>

    </div>

    <div id="error-card" class="hidden text-center bg-white/90 backdrop-blur p-12 rounded-xl shadow-lg border border-red-100">
        <h2 class="text-3xl font-bold text-red-600 mb-2">Invitation Not Found</h2>
        <p class="text-gray-700 font-medium">Please check the link and try again.</p>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = 'https://wqlwurobvkzjixkoivxf.supabase.co';
        const supabaseKey = 'sb_publishable_I4rCqO3kdJLN-U8fgLoskA_AchQwKVr';
        const supabase = createClient(supabaseUrl, supabaseKey);

        const imageLibrary = [];
        const supabaseBaseUrl = "https://wqlwurobvkzjixkoivxf.supabase.co/storage/v1/object/public/invitation-backgrounds/";

        const hinduImages = [1, 3, 4, 10, 54, 69, 80, 83, 84, 85]; 
        const muslimImages = [11, 12, 13, 14, 15, 30, 31, 32, 60, 61, 62, 64, 65, 70]; 
        const christianImages = [17, 29, 71, 72, 81];
        const minimalistNeutral = [2, 9, 82]; 
        const floralNeutral = [5, 7, 25, 33, 40, 55];
        const royalNeutral = [6, 8, 16, 24, 28, 38, 39, 47, 50, 52, 63, 66];
        
        for (let i = 1; i <= 85; i++) {
            if (hinduImages.includes(i)) imageLibrary.push({ url: `${supabaseBaseUrl}${i}.webp`, tags: ["ganesh", "om", "traditional_kerala", "royal_rajput"] });
            else if (muslimImages.includes(i)) imageLibrary.push({ url: `${supabaseBaseUrl}${i}.webp`, tags: ["bismillah", "royal_rajput"] });
            else if (christianImages.includes(i)) imageLibrary.push({ url: `${supabaseBaseUrl}${i}.webp`, tags: ["cross", "pastel_floral", "minimalist"] });
            else if (minimalistNeutral.includes(i)) imageLibrary.push({ url: `${supabaseBaseUrl}${i}.webp`, tags: ["none", "minimalist"] });
            else if (floralNeutral.includes(i)) imageLibrary.push({ url: `${supabaseBaseUrl}${i}.webp`, tags: ["neutral", "pastel_floral", "none"] });
            else if (royalNeutral.includes(i)) imageLibrary.push({ url: `${supabaseBaseUrl}${i}.webp`, tags: ["neutral", "royal_rajput", "traditional_kerala", "none"] });
        }

        function getDynamicBackground(invocation, theme) {
            let matches = imageLibrary.filter(img => img.tags.includes(invocation) && img.tags.includes(theme));
            if (matches.length === 0) matches = imageLibrary.filter(img => img.tags.includes("neutral") && img.tags.includes(theme));
            if (matches.length === 0) matches = imageLibrary.filter(img => img.tags.includes("none") && img.tags.includes(theme)); 
            if (matches.length > 0) {
                const randomIndex = Math.floor(Math.random() * matches.length);
                return matches[randomIndex].url;
            }
            return ""; 
        }

        document.addEventListener("DOMContentLoaded", async function() {
            const pathParts = window.location.pathname.split('/');
            const slug = pathParts[pathParts.length - 1]; 

            const { data, error } = await supabase
                .from('wedding_invites')
                .select('*')
                .eq('slug', slug)
                .single(); 

            if (error || !data) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-card').classList.remove('hidden');
                return;
            }

            // SMART HOST LINE LOGIC
            const gParents = data.family_details?.groomParents;
            const bParents = data.family_details?.brideParents;
            const hostLineEl = document.getElementById('host-line');

            if (gParents && bParents) {
                hostLineEl.innerText = `Together with their families, ${gParents} & ${bParents} warmly invite you to the wedding of`;
            } else if (gParents || bParents) {
                const oneParent = gParents || bParents;
                hostLineEl.innerText = `Together with their families, ${oneParent} warmly invites you to the wedding of`;
            } else {
                hostLineEl.innerText = `You are invited to the wedding of`;
            }

            // CORE DETAILS
            document.getElementById('couple-names').innerText = `${data.groom_first_name} & ${data.bride_first_name}`;
            const mainEvent = data.events[0];
            document.getElementById('welcome-msg').innerText = mainEvent.message || "Please join us to celebrate our special day.";
            
            const formatDate = (dateString) => {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' };
                return new Date(dateString).toLocaleString('en-US', options);
            };

            document.getElementById('main-date').innerText = formatDate(data.main_wedding_date);
            document.getElementById('main-venue').innerText = mainEvent.venue;

            if (mainEvent.mapsLink) {
                const mapBtn = document.getElementById('map-btn');
                mapBtn.href = mainEvent.mapsLink;
                mapBtn.classList.remove('hidden');
                mapBtn.classList.add('flex'); 
            }

            if (data.events.length > 1) {
                const recEvent = data.events[1];
                document.getElementById('reception-block').classList.remove('hidden');
                document.getElementById('rec-date').innerText = formatDate(recEvent.date);
                document.getElementById('rec-venue').innerText = recEvent.venue;
            }

            // GIFTING POLICY DISPLAY
            const giftPolicy = data.logistics?.gifting;
            if (giftPolicy) {
                document.getElementById('gifting-block').classList.remove('hidden');
                document.getElementById('gifting-text').innerText = giftPolicy;
            }

            // RSVP LOGIC
            const guestInput = document.getElementById('guest-count');
            const guestDisplay = document.getElementById('guest-display');
            
            guestInput.addEventListener('input', (e) => {
                const val = e.target.value;
                guestDisplay.innerText = val === "5" ? "5+" : val;
            });

            document.getElementById('btn-accept').addEventListener('click', () => {
                document.getElementById('rsvp-buttons').classList.add('hidden');
                document.getElementById('guest-slider-section').classList.remove('hidden');
            });

            document.getElementById('btn-decline').addEventListener('click', () => {
                document.getElementById('rsvp-buttons').classList.add('hidden');
                const thankYou = document.getElementById('rsvp-thank-you');
                thankYou.innerText = "We will miss you! Thank you for letting us know.";
                thankYou.classList.remove('hidden');
            });

            document.getElementById('btn-confirm-rsvp').addEventListener('click', () => {
                const count = guestInput.value;
                const displayCount = count === "5" ? "5+" : count;
                
                document.getElementById('guest-slider-section').classList.add('hidden');
                
                const thankYou = document.getElementById('rsvp-thank-you');
                if (count == 1) {
                    thankYou.innerText = "We can't wait to celebrate with you!";
                } else {
                    thankYou.innerText = `We can't wait to celebrate with all ${displayCount} of you!`;
                }
                thankYou.classList.remove('hidden');

                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#d4af37', '#EA4335', '#4285F4', '#34A853', '#FBBC05'],
                    zIndex: 100 
                });
            });

            // PRELOADER & THEME
            const userInvocation = data.family_details?.invocation || "none";
            const userTheme = data.design_prefs?.theme || "minimalist";
            const selectedImageUrl = getDynamicBackground(userInvocation, userTheme);
            
            if (selectedImageUrl) {
                const preloaderImg = new Image();
                preloaderImg.src = selectedImageUrl;
                
                preloaderImg.onload = () => {
                    document.getElementById('loading').classList.add('hidden');
                    const bgImageEl = document.getElementById('bg-img');
                    bgImageEl.src = selectedImageUrl;
                    bgImageEl.style.opacity = "1";
                    
                    const inviteCard = document.getElementById('invite-card');
                    inviteCard.className = `max-w-2xl w-full glass-base p-8 md:p-16 rounded-3xl text-center relative overflow-hidden shadow-2xl theme-${userTheme}`;
                };
            }
        });
    </script>
</body>
</html>
